name: Build libwsc

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release-tls
            build_type: Release
            tls: "ON"
            flags: ""
          - name: release-notls
            build_type: Release
            tls: "OFF"
            flags: ""
          - name: asan-ubsan
            build_type: RelWithDebInfo
            tls: "ON"
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
    name: ${{ matrix.name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libevent-dev \
            zlib1g-dev \
            libssl-dev \
            python3

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DUSE_TLS=${{ matrix.tls }} \
            -DLIBWSC_USE_DEBUG=OFF \
            -DLIBWSC_BUILD_TESTS=ON \
            -DLIBWSC_STRIP=OFF \
            -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: tests/run_tests.sh build
